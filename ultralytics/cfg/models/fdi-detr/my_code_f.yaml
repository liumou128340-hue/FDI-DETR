# AX ablation: F: original backbone + CSSCCFusion + RepC3.
# AX backbone means DiffFreq repeats per stage = 2,2,2,3 with channels 64,128,512,1024.
# f = CSSCCFusion, m = MANet, b = AX DiffFreq backbone.

nc: 80
scales:
  l: [1.00, 1.00, 1024]

backbone:
  - [-1, 1, HGStem, [32, 48]] # 0-P2/4
  - [-1, 6, HGBlock, [48, 128, 3]]

  - [-1, 1, DWConv, [128, 3, 2, 1, False]] # 2-P3/8
  - [-1, 6, HGBlock, [96, 512, 3]]

  - [-1, 1, DWConv, [512, 3, 2, 1, False]] # 4-P4/16
  - [-1, 6, HGBlock, [192, 1024, 5, True, False]]
  - [-1, 6, HGBlock, [192, 1024, 5, True, True]]
  - [-1, 6, HGBlock, [192, 1024, 5, True, True]] # 7-P4/16

  - [-1, 1, DWConv, [1024, 3, 2, 1, False]] # 8-P5/32
  - [-1, 6, HGBlock, [384, 2048, 5, True, False]]
head:
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 10 input_proj.2, P5 -> 256
  - [-1, 1, AIFI, [1024, 8]]
  - [-1, 1, Conv, [256, 1, 1]] # Y5

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [7, 1, Conv, [256, 1, 1, None, 1, 1, False]] # input_proj.1, P4 -> 256
  - [[-1, -2], 1, CSSCCFusion, [256, 4, 2]] # CSSCC
  - [-1, 3, RepC3, [256]] # RepC3, Y4 refine
  - [-1, 1, Conv, [256, 1, 1]] # Y4

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [3, 1, Conv, [256, 1, 1, None, 1, 1, False]] # input_proj.0, P3 -> 256
  - [[-1, -2], 1, CSSCCFusion, [256, 4, 2]] # CSSCC
  - [-1, 3, RepC3, [256]] # RepC3, Y3(D3)

  - [-1, 1, Conv, [256, 3, 2]] # bottom-up downsample
  - [[-1, 17], 1, CSSCCFusion, [256, 4, 2]] # CSSCC
  - [-1, 3, RepC3, [256]] # RepC3, D4

  - [-1, 1, Conv, [256, 3, 2]] # bottom-up downsample
  - [[-1, 12], 1, CSSCCFusion, [256, 4, 2]] # CSSCC
  - [-1, 3, RepC3, [256]] # RepC3, D5

  - [[21, 24, 27], 1, RTDETRDecoder, [nc]]
