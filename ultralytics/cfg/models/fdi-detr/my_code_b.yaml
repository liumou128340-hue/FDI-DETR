# AX ablation: B: AX DiffFreq backbone + Concat + RepC3.
# AX backbone means DiffFreq repeats per stage = 2,2,2,3 with channels 64,128,512,1024.
# f = CSSCCFusion, m = MANet, b = AX DiffFreq backbone.

nc: 80
scales:
  l: [1.00, 1.00, 512]
  x: [1.00, 1.00, 512]

stage_repeats:
  l: [1, 1, 1, 1]
  x: [2, 2, 2, 3]

stage_channels:
  l: [64, 128, 256, 512]
  x: [64, 128, 256, 512]

backbone:
  - [-1, 1, HGStem, [32, 64]] # 0-P2/4
  - [-1, 2, DiffFreq_Bottleneck, [[1, 3, 5], True]] # 1-P2

  - [-1, 1, DWConv, [128, 3, 2, 1, False]] # 2-P3/8
  - [-1, 2, DiffFreq_Bottleneck, [[1, 3, 5], True]] # 3-P3

  - [-1, 1, DWConv, [256, 3, 2, 1, False]] # 4-P4/16
  - [-1, 2, DiffFreq_Bottleneck, [[1, 3, 5], True]] # 5-P4

  - [-1, 1, DWConv, [512, 3, 2, 1, False]] # 6-P5/32
  - [-1, 3, DiffFreq_Bottleneck, [[1, 3, 5], True]] # 7-P5

head:
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 8 input_proj.2, P5 -> 256
  - [-1, 1, AIFI, [1024, 8]]
  - [-1, 1, Conv, [256, 1, 1]] # Y5

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [5, 1, Conv, [256, 1, 1, None, 1, 1, False]] # input_proj.1, P4 -> 256
  - [[-1, -2], 1, Concat, [1]] # Concat
  - [-1, 3, RepC3, [256]] # RepC3, Y4 refine
  - [-1, 1, Conv, [256, 1, 1]] # Y4

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [3, 1, Conv, [256, 1, 1, None, 1, 1, False]] # input_proj.0, P3 -> 256
  - [[-1, -2], 1, Concat, [1]] # Concat
  - [-1, 3, RepC3, [256]] # RepC3, Y3(D3)

  - [-1, 1, Conv, [256, 3, 2]] # bottom-up downsample
  - [[-1, 15], 1, Concat, [1]] # Concat
  - [-1, 3, RepC3, [256]] # RepC3, D4

  - [-1, 1, Conv, [256, 3, 2]] # bottom-up downsample
  - [[-1, 10], 1, Concat, [1]] # Concat
  - [-1, 3, RepC3, [256]] # RepC3, D5

  - [[19, 22, 25], 1, RTDETRDecoder, [nc]]
