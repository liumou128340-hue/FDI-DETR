# AP: DiffFreq backbone + CSFA + MANet.
# DiffFreq: repeats  = 2,2,2,3; channels = 64, 128, 256, 512; kernels: [1, 3, 5].
# Fusion: CSFA.
# Refine: MANet.

nc: 80
scales:
  s: [1.00, 1.00, 512]
stage_repeats:
  s: [1, 1, 1, 1]
stage_channels:
  s: [64, 128, 256, 512]

backbone:
  - [-1, 1, HGStem, [32, 64]] # 0-P2/4
  - [-1, 2, DiffFreq_Bottleneck, [[1, 3, 5], True]] # 1-P2

  - [-1, 1, DWConv, [128, 3, 2, 1, False]] # 2-P3/8
  - [-1, 2, DiffFreq_Bottleneck, [[1, 3, 5], True]] # 3-P3

  - [-1, 1, DWConv, [256, 3, 2, 1, False]] # 4-P4/16
  - [-1, 2, DiffFreq_Bottleneck, [[1, 3, 5], True]] # 5-P4

  - [-1, 1, DWConv, [512, 3, 2, 1, False]] # 6-P5/32
  - [-1, 3, DiffFreq_Bottleneck, [[1, 3, 5], True]] # 7-P5

head:
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 8 input_proj.2, P5 -> 256
  - [-1, 1, AIFI, [1024, 8]] # 9
  - [-1, 1, Conv, [256, 1, 1]] # 10, Y5

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11
  - [5, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 12 input_proj.1, P4 -> 256
  - [[-1, -2], 1, CSSCCFusion, [256, 4, 2]] # 13, CSSCC
  - [-1, 3, MANet, [256]] # 14, Y4 input
  - [-1, 1, Conv, [256, 1, 1]] # 15, Y4

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 16
  - [3, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 17 input_proj.0, P3 -> 256
  - [[-1, -2], 1, CSSCCFusion, [256, 4, 2]] # 18, CSSCC
  - [-1, 3, MANet, [256]] # 19, Y3(D3)

  - [-1, 1, Conv, [256, 3, 2]] # 20, bottom-up downsample
  - [[-1, 15], 1, CSSCCFusion, [256, 4, 2]] # 21, CSSCC
  - [-1, 3, MANet, [256]] # 22, D4

  - [-1, 1, Conv, [256, 3, 2]] # 23, bottom-up downsample
  - [[-1, 10], 1, CSSCCFusion, [256, 4, 2]] # 24, CSSCC
  - [-1, 3, MANet, [256]] # 25, D5

  - [[19, 22, 25], 1, RTDETRDecoder, [nc]]
